server:
  port: ${PORT:8081}
  servlet:
    context-path: /

spring:
  application:
    name: talentsense-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/talentsense?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:0206}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 Hours
  ai:
    provider: ${AI_PROVIDER:MOCK}
    api-key: ${AI_API_KEY:mock_key}
    model: ${AI_MODEL_NAME:gemini-1.5-pro}
  file:
    upload-dir: ${FILE_STORAGE_PATH:./uploads}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
