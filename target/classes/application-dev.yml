spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:talentsensedb;DB_CLOSE_DELAY=-1;MODE=MySQL}
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect

logging:
  level:
    com.talentsense: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
